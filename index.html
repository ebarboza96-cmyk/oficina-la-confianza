<script>// Puerta con PIN de la oficina en internet (la arma publicar_web.py dentro de index.html).
// La página es pública pero no trae datos: llegan en datos.enc, cifrados con AES-GCM y una clave
// que sale del PIN (PBKDF2-SHA256). Sin el PIN correcto no se puede leer nada.
(() => {
  const GUARDADA = "oficina-clave";            // la clave (nunca el PIN) si marcan "recordar"
  let clave = null, sal = "", ultimoIv = "", entregar;
  window.PANEL_PROMESA = new Promise(r => { entregar = r; });

  const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const aB64 = b => { let s = ""; for (const x of new Uint8Array(b)) s += String.fromCharCode(x); return btoa(s); };
  const leer = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
  const guardar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  async function traer() {
    const r = await fetch("datos.enc?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("No encontré los datos (" + r.status + ")");
    return r.json();
  }
  async function derivar(pin, paquete) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: deB64(paquete.sal), iterations: paquete.vueltas, hash: "SHA-256" },
                                   base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function abrir(paquete, k) {
    const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(paquete.iv) }, k, deB64(paquete.datos));
    return JSON.parse(new TextDecoder().decode(claro));
  }
  function listo(panel, paquete, k) {
    if (!capa.isConnected) return;   // ya había entrado (PIN escrito y reintento automático a la vez)
    clave = k; sal = paquete.sal; ultimoIv = paquete.iv;
    window.PANEL = panel; capa.remove(); entregar(panel);
    setInterval(refrescar, 120000);   // los datos nuevos llegan cada 15 minutos más o menos
    // "Salir": olvida este aparato (para cuando entraron desde una compu prestada)
    const salir = document.createElement("button");
    salir.textContent = "🔒 Salir"; salir.title = "Cerrar y olvidar el PIN en este aparato";
    salir.onclick = () => { guardar(GUARDADA, null); location.reload(); };
    document.getElementById("barra")?.appendChild(salir);
  }
  async function refrescar() {
    try {
      const p = await traer();
      if (p.iv === ultimoIv) return;
      if (p.sal !== sal) { guardar(GUARDADA, null); location.reload(); return; }   // cambiaron el PIN
      window.PANEL = await abrir(p, clave); ultimoIv = p.iv;
      window.alLlegarDatos?.();
    } catch { /* sin internet un rato: se vuelve a intentar en 2 minutos */ }
  }

  // ---------- la pantalla del PIN ----------
  const capa = document.createElement("div");
  capa.id = "puerta";
  capa.innerHTML = `<style>
    #puerta { position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px;
              background:radial-gradient(circle at 50% 30%, #1d2b4f, #0b1020 70%); color:#e8ecf3;
              font-family:"Segoe UI", Calibri, Arial, sans-serif; }
    #puerta form { width:min(340px, 100%); display:flex; flex-direction:column; gap:14px; text-align:center; }
    #puerta h1 { margin:0; font-size:26px; } #puerta p { margin:0; color:#b9c3d3; font-size:14.5px; }
    #puerta .logo { font-size:54px; line-height:1; }
    #puerta input[type=password] { font-size:30px; letter-spacing:.35em; text-align:center; padding:12px; border-radius:14px;
              border:2px solid #334155; background:#0f172a; color:#fff; outline:none; }
    #puerta input[type=password]:focus { border-color:#60a5fa; }
    #puerta button { font-size:18px; font-weight:700; padding:12px; border-radius:14px; border:0; background:#2563eb; color:#fff; cursor:pointer; }
    #puerta button:disabled { opacity:.6; cursor:wait; }
    #puerta label { display:flex; gap:8px; align-items:center; justify-content:center; color:#b9c3d3; font-size:14px; }
    #puerta .error { color:#fca5a5; font-weight:700; min-height:1.3em; }
  <\/style>
  <form autocomplete="off">
    <div class="logo">🏢<\/div><h1>La oficina<\/h1><p>Escribí el PIN para entrar<\/p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" required>
    <label><input id="recordar" type="checkbox"> Recordar en este aparato<\/label>
    <button id="entrar">Entrar<\/button><div class="error" id="errorPin" role="alert"><\/div>
  <\/form>`;
  document.body.appendChild(capa);
  const form = capa.querySelector("form"), boton = capa.querySelector("#entrar"), error = capa.querySelector("#errorPin");

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const pin = capa.querySelector("#pin").value.trim();
    if (!pin) return;
    boton.disabled = true; boton.textContent = "Abriendo…"; error.textContent = "";
    try {
      const paquete = await traer(), k = await derivar(pin, paquete);
      let panel;
      try { panel = await abrir(paquete, k); }
      catch { error.textContent = "PIN incorrecto"; capa.querySelector("#pin").select(); return; }
      if (capa.querySelector("#recordar").checked) guardar(GUARDADA, { sal: paquete.sal, k: aB64(await crypto.subtle.exportKey("raw", k)) });
      listo(panel, paquete, k);
    } catch (err) {
      error.textContent = "No pude abrir la oficina: " + err.message;
    } finally { boton.disabled = false; boton.textContent = "Entrar"; }
  });

  // ¿ya entró antes en este aparato? Entonces no pide el PIN otra vez. La clave guardada solo se
  // borra si de verdad ya no sirve (cambiaron el PIN); si es que no hay internet, se reintenta.
  async function entrarSolo() {
    const g = leer(GUARDADA);
    if (!g || !capa.isConnected) return;
    let paquete;
    try { paquete = await traer(); }
    catch {
      error.textContent = "Sin conexión con la oficina, reintentando…";
      setTimeout(entrarSolo, 15000); return;
    }
    try {
      if (paquete.sal !== g.sal) throw new Error("PIN nuevo");
      const k = await crypto.subtle.importKey("raw", deB64(g.k), { name: "AES-GCM" }, true, ["decrypt"]);
      listo(await abrir(paquete, k), paquete, k);
    } catch { guardar(GUARDADA, null); error.textContent = ""; capa.querySelector("#pin").focus(); }
  }
  capa.querySelector("#pin").focus();
  entrarSolo();
  addEventListener("online", entrarSolo);
})();
</script>

// En línea la página no puede leer agentes.js: en el link de claude.ai los datos llegan de la base de

// dos casos se usa la hora de Costa Rica aunque quien mire esté de viaje en otro país.
const enClaude = typeof window.claude?.use === "function", enWeb = !!window.PANEL_PROMESA, enLinea = enClaude || enWeb;
if (enWeb) await window.PANEL_PROMESA;   // la oficina se arma cuando ya entraron con el PIN
const horaCR = () => new Date(Date.now() + (new Date().getTimezoneOffset() - 360) * 60000);
const fechaCR = s => new Date(/[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s + "-06:00");   // las horas sin zona son de Costa Rica
const HORA = { hour: "2-digit", minute: "2-digit", timeZone: "America/Costa_Rica" };

// =====================================================================================

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();

scene.background = new THREE.Color("#1a2133");
scene.fog = new THREE.Fog("#1a2133", 42, 90);
const CENTRO_X = 5.5;   // la oficina (x -11..11) más la sala de deshuese (x 11..22)

function encuadre(v) {
  const angosta = camera.aspect < 0.8, b = angosta ? v.cel : v;

}

const M = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05, ...extra });
function caja(w, h, d, mat, x, y, z, padre = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; padre.add(m); return m;
}
function cilindro(rt, rb, h, mat, x, y, z, padre = scene, seg = 20) {

function lienzo(w, h, dibujar) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  dibujar(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.userData = { c, g }; return t;
}
function cartel(texto, color = "#1F4E78", fondo = "rgba(255,255,255,.92)", ancho = 256) {
  const t = lienzo(ancho, 64, (g, w, h) => {
    g.fillStyle = fondo; g.beginPath(); g.roundRect(4, 8, w - 8, h - 16, 24); g.fill();
    g.fillStyle = color; g.font = "800 30px Segoe UI, Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(texto, w / 2, h / 2 + 1);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false })); s.scale.set(ancho / 160, 0.4, 1); s.renderOrder = 10; return s;
}
function emoji(e, tam = 0.6) {
  const t = lienzo(128, 128, g => { g.font = "96px Segoe UI Emoji, Apple Color Emoji, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e, 64, 72); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); s.scale.set(tam, tam, 1); s.renderOrder = 11; s.userData.e = e; return s;
}
function cambiarEmoji(s, e) {
  if (s.userData.e === e) return; s.userData.e = e; const { g } = s.material.map.userData;
  g.clearRect(0, 0, 128, 128); g.font = "96px Segoe UI Emoji, Apple Color Emoji, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e, 64, 72); s.material.map.needsUpdate = true;
}

function fundirQuietos(desde, aparte) {
  const grupos = new Map();
  for (const o of scene.children.slice(desde)) {
    if (!o.isMesh || aparte.has(o) || !o.visible) continue;
    const m = o.material;
    if (Array.isArray(m) || m.map || m.transparent || m.emissiveMap) continue;
    const clave = [m.color.getHexString(), m.roughness, m.metalness, m.emissive.getHexString(), m.emissiveIntensity, o.castShadow].join("|");
    if (!grupos.has(clave)) grupos.set(clave, { m, sombra: o.castShadow, piezas: [], mallas: [] });
    o.updateMatrix(); const gr = grupos.get(clave);
    gr.piezas.push(o.geometry.clone().applyMatrix4(o.matrix)); gr.mallas.push(o);
  }
  for (const { m, sombra, piezas, mallas } of grupos.values()) {
    if (mallas.length < 2) continue;
    const unidas = mergeGeometries(piezas, false);
    if (!unidas) continue;   // geometrías incompatibles: se quedan como estaban
    mallas.forEach(o => { scene.remove(o); o.geometry.dispose(); });
    const una = new THREE.Mesh(unidas, m); una.castShadow = sombra; una.receiveShadow = true; scene.add(una);
  }
}

// (la línea de producción solo se cruza por las puntas) y las dos se unen por la puerta de tiras.
const XS = [-8.6, -4.1, -0.3, 3.6, 7.6, 9.4], ZS = [-5.2, -1.0, 3.2, 5.0];
const XB = [11.9, 14.5, 17.5, 21.5], ZB = [-3.4, 0.6, 3.2, 5.0];
const nodos = [], ady = [];
function nodo(x, z) { let i = nodos.findIndex(n => n[0] === x && n[1] === z); if (i < 0) { i = nodos.push([x, z]) - 1; ady[i] = []; } return i; }
function unir(a, b) { ady[a].push(b); ady[b].push(a); }
function malla(xs, zs, cortado = () => false) {
  xs.forEach((x, i) => zs.forEach((z, j) => {
    const n = nodo(x, z);
    if (i > 0) unir(nodo(xs[i - 1], z), n);
    if (j > 0 && !cortado(x, zs[j - 1])) unir(nodo(x, zs[j - 1]), n);
  }));
}

const enSala = x => x > SALA_X0;
function cercano(x, z) {   // el nodo más cerca, del mismo lado de la división (si no, cruzaría el vidrio)
  let m = -1, dm = Infinity;
  nodos.forEach(([a, b], i) => { const d = Math.hypot(a - x, b - z); if (enSala(a) === enSala(x) && d < dm) { dm = d; m = i; } });
  return m;
}
function camino(x0, z0, x1, z1) {
  const a = cercano(x0, z0), b = cercano(x1, z1), prev = { [a]: -1 }, cola = [a];
  while (cola.length) { const n = cola.shift(); if (n === b) break; for (const v of ady[n]) if (!(v in prev)) { prev[v] = n; cola.push(v); } }
  const r = []; for (let n = b; n !== -1 && n !== undefined; n = prev[n]) r.unshift(nodos[n]);
  return [...r, [x1, z1]];
}

const TBC = { tinta: "#f0efec", tinta2: "#c3c2b7", tenue: "#898781", rejilla: "#2c2c2a", eje: "#383835", sup: "#1a1a19",

         `<tbody>${filas.map(f => `<tr>${f.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;

// Columnas (una serie): <= 24 px de grueso, valor del último día escrito arriba.

// Barras horizontales: categorías sin orden (medios de pago) en un solo color, el valor en la punta.
function graficoBarras(filas, fmt, W = 640) {

    s += `<path d="M${iz},${y}H${iz + largo - 4}Q${iz + largo},${y} ${iz + largo},${y + 4}V${y + 14}Q${iz + largo},${y + 18} ${iz + largo - 4},${y + 18}H${iz}Z" fill="${TBC.s[0]}"/>`;

let graficosTablero = [];

  if (hay) h += `<div class="tb-c"><div class="tb-et">Último pago del CNP</div><div class="tb-v">${T.ultimo_pago ? colonCorto(T.ultimo_pago.monto) : "—"}</div><div class="tb-d">${T.ultimo_pago ? esc(T.ultimo_pago.fecha) + " · pago " + esc(T.ultimo_pago.numero) : ""}</div></div>`;
  if (cats.length) {
    h += `<div class="tb-c w6"><div class="tb-et">Kilos por empacar, por ruta</div><div class="tb-ley">${rutas.map((r, k) => `<span><i style="background:${TBC.s[k] || TBC.tenue}"></i>${esc(r)}</span>`).join("")}</div>` +
         lugar(w => graficoApiladas(cats, rutas, (c, r) => K[c][r] || 0, w)) +
         tablaHtml(["Carne", ...rutas, "Total"], cats.map(c => [c, ...rutas.map(r => kgTxt(K[c][r] || 0)), kgTxt(rutas.reduce((a, r) => a + (K[c][r] || 0), 0))])) + `</div>`;
  }

  // --- facturación y pagos ---
  const F = T.facturacion || {}, kf = Object.fromEntries(F.kpis || []);

  h += `<div class="tb-c w6"><div class="tb-et">Próxima factura de escuelas</div><div class="tb-v">${esc(kf["Escuelas cerradas"] || "—")}</div>` +
       `<div class="tb-d">${esc(F.texto || "")}${kf.Meta ? " · meta " + esc(kf.Meta) : ""}</div>` +
       `<div class="tb-medidor ${(F.progreso || 0) >= 100 ? "lleno" : ""}" role="meter" aria-valuenow="${F.progreso || 0}" aria-valuemin="0" aria-valuemax="100"><div style="width:${Math.min(100, F.progreso || 0)}%"></div></div>` +
       `<ul class="tb-lista">${(F.lista || []).map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join("")}</ul></div>`;
  const pm = T.pagos_mes || [];
  const up = T.ultimo_pago;
  h += `<div class="tb-c w6"><div class="tb-et">Pagos del CNP por mes</div>` +
       (up && !hay ? `<div class="tb-d">Último pago: <b style="color:var(--tinta)">${esc(colon(up.monto))}</b> el ${esc(up.fecha)} · pago ${esc(up.numero)}</div>` : "") +
       (T.pagos_mes_parcial ? `<div class="tb-d">El primer mes está incompleto: se empezaron a anotar los pagos a medio mes</div>` : "") +
       (pm.length ? lugar(w => graficoColumnas(pm, colon, mesCorto, w, 170)) + tablaHtml(["Mes", "Pagado"], pm.slice().reverse().map(p => [mesCorto(p[0]), colon(p[1])])) : `<div class="tb-d">Sin pagos anotados</div>`) + `</div>`;
  return h + `</div>`;
}
const capaTablero = document.getElementById("tablero"), cuerpoTablero = document.getElementById("tbCuerpo"), tip = document.getElementById("tbTip");

// El tablero en la pantalla grande de la pared (dibujado en el lienzo, alterna con las diapositivas)
function dibujarTablero(g, W, H, avance) {
  const s = W / 1600, T = ((window.PANEL || {}).datos || {}).tablero || {}, C = T.caja || {}, P = C.periodos;
  g.fillStyle = "#0d0d0d"; g.fillRect(0, 0, W, H); g.textBaseline = "middle"; g.textAlign = "left";
  g.fillStyle = "#f0efec"; g.font = `650 ${50 * s}px Segoe UI, Arial`; g.fillText("📊 Tablero", 48 * s, 70 * s);
  g.fillStyle = "#898781"; g.font = `500 ${26 * s}px Segoe UI, Arial`; g.textAlign = "right";
  g.fillText(new Date().toLocaleTimeString("es-CR", HORA), W - 48 * s, 70 * s); g.textAlign = "left";
  const viejos = P && (C.error || new Date(C.actualizado).toLocaleDateString("en-CA", { timeZone: "America/Costa_Rica" }) !== new Date().toLocaleDateString("en-CA", { timeZone: "America/Costa_Rica" }));
  if (viejos) { g.fillStyle = "#fab219"; g.font = `600 ${24 * s}px Segoe UI, Arial`; g.fillText(`⚠ Caja: datos del ${new Date(C.actualizado).toLocaleDateString("es-CR", { day: "numeric", month: "short" })}`, 330 * s, 72 * s); }
  const fichas = P ? [[P.hoy.fecha ? "Último día cerrado" : P.hoy.parcial ? P.hoy.titulo : "Ventas de hoy", colon(P.hoy.ventas)], ["Esta semana", colonCorto(P.semana.ventas)], ["Este mes", colonCorto(P.mes.ventas)], ["Pedidos por empacar", String(T.pedidos_total ?? "—")]]
                   : [["Pedidos por empacar", String(T.pedidos_total ?? "—")], ["Impresas hoy", String(T.impresas_hoy ?? 0)], ["Sin código", String((T.codigos || {}).sin_codigo ?? "—")], ["Último pago CNP", T.ultimo_pago ? colonCorto(T.ultimo_pago.monto) : "—"]];
  const fw = (W - 96 * s - 3 * 24 * s) / 4;
  fichas.forEach(([k, v], i) => {
    const x = 48 * s + i * (fw + 24 * s), y = 130 * s;
    g.fillStyle = "#1a1a19"; g.beginPath(); g.roundRect(x, y, fw, 200 * s, 22 * s); g.fill();
    g.fillStyle = "#c3c2b7"; g.font = `550 ${28 * s}px Segoe UI, Arial`; g.fillText(recortar(g, k, fw - 56 * s), x + 28 * s, y + 52 * s);
    g.fillStyle = "#f0efec"; g.font = `650 ${(i === 2 && P ? 64 : 56) * s}px Segoe UI, Arial`; g.fillText(recortar(g, v, fw - 56 * s), x + 28 * s, y + 132 * s);
  });
  // gráfico de abajo: ventas de los últimos 30 días, o las órdenes de los últimos 14 si la caja no está conectada
  const serie = P ? (C.serie30 || []) : (T.ordenes_dia || []), titulo = P ? "Ventas por día · últimos 30 días" : "Órdenes impresas por día · últimos 14 días";
  const x0 = 48 * s, y0 = 380 * s, w = W - 96 * s, h = H - y0 - 70 * s;
  g.fillStyle = "#1a1a19"; g.beginPath(); g.roundRect(x0, y0, w, h, 22 * s); g.fill();
  g.fillStyle = "#c3c2b7"; g.font = `550 ${28 * s}px Segoe UI, Arial`; g.fillText(titulo, x0 + 28 * s, y0 + 46 * s);
  if (serie.length) {
    const px = x0 + 40 * s, pw = w - 80 * s, py = y0 + 90 * s, ph = h - 130 * s, max = Math.max(...serie.map(p => p[1]), 1);
    g.strokeStyle = "#383835"; g.lineWidth = 2 * s; g.beginPath(); g.moveTo(px, py + ph); g.lineTo(px + pw, py + ph); g.stroke();
    if (P) {
      const X = i => px + i * pw / Math.max(1, serie.length - 1), Y = v => py + ph - v / max * ph;
      g.beginPath(); serie.forEach((p, i) => i ? g.lineTo(X(i), Y(p[1])) : g.moveTo(X(i), Y(p[1]))); g.lineTo(X(serie.length - 1), py + ph); g.lineTo(X(0), py + ph); g.closePath();
      g.fillStyle = "rgba(57,135,229,.12)"; g.fill();
      g.beginPath(); serie.forEach((p, i) => i ? g.lineTo(X(i), Y(p[1])) : g.moveTo(X(i), Y(p[1]))); g.strokeStyle = "#3987e5"; g.lineWidth = 4 * s; g.lineJoin = "round"; g.stroke();
    } else {
      const banda = pw / serie.length, ancho = Math.min(48 * s, banda * 0.6);
      serie.forEach((p, i) => { const bh = p[1] / max * ph; g.fillStyle = "#3987e5"; g.beginPath(); g.roundRect(px + i * banda + (banda - ancho) / 2, py + ph - bh, ancho, bh, [8 * s, 8 * s, 0, 0]); g.fill(); });
    }
  }
  g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(0, H - 10 * s, W, 10 * s);
  g.fillStyle = "#3987e5"; g.fillRect(0, H - 10 * s, W * avance, 10 * s);
  g.textBaseline = "alphabetic";
}

// Globos de texto sobre los agentes (HTML, siempre legibles)
const capa = document.getElementById("globos"), globos = {};
function globosDe() {
  for (const p of Object.values(gente)) {
    let el = globos[p.id];
    if (!el) { el = document.createElement("div"); el.className = "globo"; el.style.setProperty("--c", p.ag.color); capa.appendChild(el); globos[p.id] = el; }
    const ver = p.estado !== "listo" || p.mostrar > performance.now();
    if (!ver) { el.style.display = "none"; continue; }
    const v = new THREE.Vector3(p.g.position.x, 3.15, p.g.position.z).project(camera);
    if (v.z > 1) { el.style.display = "none"; continue; }
    el.style.display = "block"; el.className = "globo " + p.estado;
    el.style.left = ((v.x + 1) / 2 * innerWidth) + "px"; el.style.top = ((1 - v.y) / 2 * innerHeight) + "px";
    const html = (p.estado === "listo" ? p.tarea : p.tarea) + (p.detalle ? `<small>${p.detalle.slice(0, 80)}</small>` : "");

// Seguir a un agente con la cámara
let seguido = null;

function botonesAgentes() {
  if (botones.childElementCount || !window.PANEL) return;
  for (const [id, ag] of Object.entries(PANEL.equipo)) {
    const b = document.createElement("button"); b.textContent = ag.icono + " " + ag.nombre;
    b.onclick = () => { seguido = seguido === id ? null : id; [...botones.children].forEach(x => x.classList.remove("activo")); if (seguido) b.classList.add("activo"); if (gente[id]) gente[id].mostrar = performance.now() + 8000; };
    botones.appendChild(b);

document.getElementById("bVista").onclick = () => { seguido = null; [...botones.children].forEach(x => x.classList.remove("activo")); volarA = encuadre(VISTA); };
document.getElementById("bPlanta").onclick = () => { seguido = null; [...botones.children].forEach(x => x.classList.remove("activo")); volarA = encuadre(VISTA_PLANTA); };
let volarA = null;
const ray = new THREE.Raycaster();
let bajoEn = null;   // para no confundir girar la cámara con un clic
renderer.domElement.addEventListener("pointerdown", e => { bajoEn = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("click", e => {
  if (bajoEn && Math.hypot(e.clientX - bajoEn[0], e.clientY - bajoEn[1]) > 6) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  let tocado = false;
  for (const p of Object.values(gente)) {

      [...botones.children].forEach((x, i) => x.classList.toggle("activo", Object.keys(PANEL.equipo)[i] === p.id)); }
  }
  if (!tocado && ray.intersectObjects([pantallaGrande, pantallaChica]).length) abrirPresentacion();
  else if (!tocado && ray.intersectObject(pantallaProd).length) abrirPresentacion(diapos().findIndex(d => /^Producción/.test(d.titulo || "")));
});

// =====================================================================================
//  Animación
// =====================================================================================
const reloj3 = new THREE.Clock();
let ultimoMinuto = -1, ultimoSeg = -1;
function cuadro() {
  const dt = Math.min(0.05, reloj3.getDelta()), t = reloj3.elapsedTime, ahora = horaCR();
  // luz del día
  if (ahora.getSeconds() !== ultimoSeg) {
    ultimoSeg = ahora.getSeconds(); pintarReloj(ahora);
    const h = ahora.getHours() + ahora.getMinutes() / 60, noche = h < 6 || h >= 19;
    const ang = ((h - 6) / 12) * Math.PI;  // 6:00 sale, 18:00 se pone
    sol.position.set(CENTRO_X + Math.cos(ang) * 18, Math.max(2, Math.sin(ang) * 20), 10);
    sol.intensity = noche ? 0.08 : 0.6 + Math.sin(Math.max(0, Math.min(Math.PI, ang))) * 1.2;
    sol.color.set(h >= 16.5 && !noche ? "#ffc58a" : "#fff3dc");
    hemi.intensity = noche ? 0.18 : 0.55;
    for (const l of lamparas) { l.intensity = noche ? 9 : (h >= 17 ? 3 : 0); l.userData.foco.material.emissiveIntensity = l.intensity > 0 ? 1 : 0; }
    // la sala de deshuese: luz de planta en el turno; fuera de turno, oscura (luces apagadas del todo)
    const enPlanta = enTurnoPlanta();
    focosSala.forEach(l => l.intensity = enPlanta ? 7 : 0);
    matsSala.forEach(m => m.envMapIntensity = enPlanta ? 1 : 0.25);
    scene.background.set(noche ? "#0b1020" : "#1a2133");
    if (ahora.getMinutes() !== ultimoMinuto) { ultimoMinuto = ahora.getMinutes(); pintarCielo(ahora.getHours()); }
  }
  // luces del servidor
  leds.forEach((l, i) => l.material.emissiveIntensity = Math.sin(t * (gente.vigilante && gente.vigilante.estado === "trabajando" ? 18 : 5) + i * 1.9) > 0 ? 1.6 : 0.1);
  ledImp.material.emissiveIntensity = gente.impresor && gente.impresor.estado === "trabajando" ? (Math.sin(t * 10) > 0 ? 2 : 0.2) : 1;
  // agentes
  for (const p of Object.values(gente)) {
    const pos = p.g.position;
    if (p.ruta.length) andar(p, dt, t);
    else {
      p.espera -= dt;
      if (p.espera <= 0) pasear(p);
      const sentado = p.pose === "sentado";
      p.cuerpo.position.y = sentado ? -0.36 : 0;
      p.pi.rotation.x = p.pd.rotation.x = sentado ? -1.45 : 0;
      const tecleando = p.estado === "trabajando" || p.haciendo === "💻";
      p.bi.rotation.x = tecleando ? -1.1 + Math.sin(t * 16) * 0.12 : sentado ? -0.3 : Math.sin(t * 1.5 + p.fase) * 0.05;
      p.bd.rotation.x = tecleando ? -1.1 + Math.cos(t * 16) * 0.12 : sentado ? -0.3 : -Math.sin(t * 1.5 + p.fase) * 0.05;
      if (p.haciendo === "💤") { p.cuerpo.rotation.z = 0.35; } else p.cuerpo.rotation.z = 0;
    }
    girar(p, dt);
    // ícono sobre la cabeza
    cambiarEmoji(p.icono, p.estado === "problema" ? "❗" : p.estado === "esperando" ? "⏳" : p.estado === "trabajando" ? p.ag.icono : (p.ruta.length ? "" : p.haciendo));
    p.icono.position.y = 2.8 + Math.sin(t * 3 + p.fase) * 0.06;
    p.icono.material.opacity = 1;
    if (p.estado === "problema") p.icono.scale.setScalar(0.6 + Math.abs(Math.sin(t * 5)) * 0.25); else p.icono.scale.setScalar(0.6);
    // pantalla del escritorio
    const pant = pantallas[p.id];
    if (pant) { const aqui = !p.ruta.length && p.pose === "sentado" && Math.hypot(pos.x - ESCRITORIOS[p.id][0], pos.z - ESCRITORIOS[p.id][1] - 0.95) < 0.5;
      pant.material.emissiveIntensity = aqui ? 0.95 + Math.sin(t * 6) * 0.1 : 0.45; }
  }
  efectosDe(t);
  // la sala de deshuese: trabaja de 5:00 a 18:00
  const turno = enTurnoPlanta();
  moverCarniceros(dt, t, turno);
  if (turno) avanzarLinea(dt); else if (linea.activa) vaciarLinea();
  moverFichas(dt, t); moverTiras(dt, t);
  pintarPantallas(performance.now()); pintarPresentacion(performance.now());
  // cámara
  if (volarA) { camera.position.lerp(volarA.pos, 0.05); controls.target.lerp(volarA.mira, 0.05); if (camera.position.distanceTo(volarA.pos) < 0.05) volarA = null; }
  if (seguido && gente[seguido]) {
    const g = gente[seguido].g.position, mira = new THREE.Vector3(g.x, 1.2, g.z);
    controls.target.lerp(mira, 0.08);
    const quiero = mira.clone().add(new THREE.Vector3(4.5, 5, 6)); camera.position.lerp(quiero, 0.03);
  }
  if (!presAbierta && capaTablero.style.display !== "block") {   // con la presentación o el tablero abiertos no se dibuja la oficina
    controls.update();
    renderer.render(scene, camera);
    globosDe();
  }
  requestAnimationFrame(cuadro);
}
